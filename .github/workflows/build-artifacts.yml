name: Build v2 artifacts

on:
  push:
    branches:
      - codex/ci-build-artifacts
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Playwright 1.53 supports Ubuntu 24.04, not the rolling 26.04 image.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify and build npm SDK
        run: |
          pnpm --filter wireflip test
          pnpm --filter wireflip build
          mkdir -p artifacts/npm
          pnpm --dir packages/npm pack --pack-destination ../../artifacts/npm
          node scripts/verify-sdk-packages.mjs

      - name: Verify and package Chrome extension
        run: |
          pnpm --filter browser-wireflip exec tsc -p tsconfig.json --noEmit
          pnpm --filter browser-wireflip exec eslint src tests
          pnpm --filter browser-wireflip test:run
          pnpm --filter browser-wireflip build:chrome
          pnpm --filter browser-wireflip package:chrome

      - name: Build product website and legacy bridge
        run: pnpm --filter website build

      - name: Run Chrome extension end-to-end tests
        id: chrome_e2e
        continue-on-error: true
        env:
          WIREFLIP_INLINE_EVIDENCE: '1'
        run: |
          pnpm --filter browser-wireflip exec playwright install --with-deps chromium
          xvfb-run -a pnpm --filter browser-wireflip test:e2e

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-e2e-diagnostics-${{ github.sha }}
          path: packages/browser-extension/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify and package Firefox extension
        run: pnpm --filter browser-wireflip check:firefox

      - name: Install native Firefox test browser
        run: bash packages/browser-extension/scripts/install-firefox-test-browser.sh "$RUNNER_TEMP/wireflip-firefox"

      - name: Verify one-approval Playground in candidate Firefox
        id: firefox_activation
        continue-on-error: true
        env:
          FIREFOX_BINARY: ${{ runner.temp }}/wireflip-firefox/firefox/firefox
          GECKODRIVER: ${{ runner.temp }}/wireflip-firefox/geckodriver
        run: python3 packages/browser-extension/tests/firefox/automatic_playground_test.py

      - name: Run Firefox extension end-to-end tests
        id: firefox_e2e
        continue-on-error: true
        env:
          FIREFOX_BINARY: ${{ runner.temp }}/wireflip-firefox/firefox/firefox
          GECKODRIVER: ${{ runner.temp }}/wireflip-firefox/geckodriver
          FIREFOX_LEGACY_XPI: ${{ runner.temp }}/wireflip-firefox/legacy-v1.xpi
        run: pnpm --filter browser-wireflip test:e2e:firefox

      - name: Verify packaged SDKs in native Firefox
        id: firefox_sdk
        continue-on-error: true
        env:
          FIREFOX_BINARY: ${{ runner.temp }}/wireflip-firefox/firefox/firefox
          GECKODRIVER: ${{ runner.temp }}/wireflip-firefox/geckodriver
        run: python3 packages/browser-extension/tests/firefox/sdk_package_test.py

      - name: Upload Firefox diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-firefox-diagnostics-${{ github.sha }}
          path: packages/browser-extension/test-results/firefox
          if-no-files-found: ignore
          retention-days: 7

      # Collect independent browser failures in one run without allowing a green gate.
      - name: Require all native browser acceptance checks
        if: always()
        env:
          CHROME_RESULT: ${{ steps.chrome_e2e.outcome }}
          FIREFOX_ACTIVATION_RESULT: ${{ steps.firefox_activation.outcome }}
          FIREFOX_RESULT: ${{ steps.firefox_e2e.outcome }}
          SDK_RESULT: ${{ steps.firefox_sdk.outcome }}
        run: |
          test "$CHROME_RESULT" = success
          test "$FIREFOX_ACTIVATION_RESULT" = success
          test "$FIREFOX_RESULT" = success
          test "$SDK_RESULT" = success

      - name: Upload SDK acceptance archives and checksums
        uses: actions/upload-artifact@v4
        with:
          name: wireflip-sdk-preflight-${{ github.sha }}
          path: artifacts/sdk-preflight
          if-no-files-found: error
          retention-days: 14

      - name: Validate extension packages
        run: |
          unzip -t packages/browser-extension/dist/wireflip-chrome-*.zip
          unzip -t packages/browser-extension/dist/wireflip-firefox-*.zip
          test -f packages/browser-extension/dist/chrome/manifest.json
          test -f packages/browser-extension/dist/firefox/manifest.json
          cp packages/browser-extension/CI-ARTIFACT-INSTALL.md packages/browser-extension/dist/chrome/INSTALL.md
          cp packages/browser-extension/CI-ARTIFACT-INSTALL.md packages/browser-extension/dist/firefox/INSTALL.md

      - name: Upload Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: wireflip-chrome-${{ github.sha }}
          # GitHub artifacts are ZIP files already. Uploading the packaged ZIP
          # produced a nested archive that looked corrupt when installed directly.
          path: packages/browser-extension/dist/chrome
          if-no-files-found: error
          retention-days: 14

      - name: Upload npm package
        uses: actions/upload-artifact@v4
        with:
          name: wireflip-npm-${{ github.sha }}
          path: artifacts/npm/*.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Upload Firefox extension
        uses: actions/upload-artifact@v4
        with:
          name: wireflip-firefox-${{ github.sha }}
          path: packages/browser-extension/dist/firefox
          if-no-files-found: error
          retention-days: 14

      - name: Upload website build
        uses: actions/upload-artifact@v4
        with:
          name: wireflip-site-${{ github.sha }}
          path: packages/website/dist
          if-no-files-found: error
          retention-days: 14
