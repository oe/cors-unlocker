name: Website and release packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate rules and SDKs
        run: |
          pnpm test:run
          pnpm --filter browser-cors-unlocker exec tsc -p tsconfig.json --noEmit
          pnpm --filter browser-cors-unlocker exec eslint src tests
      - name: Build website and extension archives
        run: pnpm build
      - name: Upload release archives
        uses: actions/upload-artifact@v4
        with:
          name: extension-release-archives
          path: packages/browser-extension/dist/forth-intercept-*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Deploy website
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: Cecilapp/GitHub-Pages-deploy@3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          email: okarl@outlook.com
          branch: gh-pages
          build_dir: packages/website/dist
          jekyll: no

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: extension-release-archives
          path: release-assets
      - name: Attach installable archives to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.zip --clobber
