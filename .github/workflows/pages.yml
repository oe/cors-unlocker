name: Website and release packages

on:
  push:
    tags: ['v*']
  workflow_run:
    workflows: ['Build v2 artifacts']
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate rules and SDKs
        run: |
          pnpm test:run
          pnpm --filter browser-wireflip exec tsc -p tsconfig.json --noEmit
          pnpm --filter browser-wireflip exec eslint src tests
      - name: Build website and extension archives
        run: pnpm build
      - name: Upload release archives
        uses: actions/upload-artifact@v4
        with:
          name: extension-release-archives
          path: packages/browser-extension/dist/wireflip-*.zip
          if-no-files-found: error
          retention-days: 14

  deploy:
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pages-main
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - name: Ignore acceptance for a superseded main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$latest" = "$ACCEPTED_SHA" ]; then echo 'deploy=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.current.outputs.deploy == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Download the already accepted website
        if: steps.current.outputs.deploy == 'true'
        uses: actions/download-artifact@v4
        with:
          name: wireflip-site-${{ github.event.workflow_run.head_sha }}
          path: accepted-site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Deploy accepted website
        if: steps.current.outputs.deploy == 'true'
        uses: Cecilapp/GitHub-Pages-deploy@3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          email: okarl@outlook.com
          branch: gh-pages
          build_dir: accepted-site
          jekyll: no

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: extension-release-archives
          path: release-assets
      - name: Attach installable archives to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.zip --clobber
