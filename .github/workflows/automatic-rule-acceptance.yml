name: Automatic rule activation acceptance
on:
  pull_request:
    paths:
      - packages/browser-extension/**
      - packages/website/**
      - packages/npm/**
      - .github/workflows/automatic-rule-acceptance.yml
  push:
    branches: [main]
    paths:
      - packages/browser-extension/**
      - packages/website/**
      - packages/npm/**
      - .github/workflows/automatic-rule-acceptance.yml
permissions:
  contents: read
jobs:
  activation:
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build exact candidate and website
        run: |
          pnpm --filter wireflip build
          pnpm --filter website build
          pnpm --filter browser-wireflip build:${{ matrix.browser }}
      - name: Install candidate Chrome browser
        if: matrix.browser == 'chrome'
        run: pnpm --filter browser-wireflip exec playwright install --with-deps chromium
      - name: Verify one-approval activation in Chrome
        if: matrix.browser == 'chrome'
        env:
          WIREFLIP_INLINE_EVIDENCE: '1'
        run: xvfb-run -a pnpm --filter browser-wireflip exec playwright test --grep 'enables a Playground example with one native approval|authorizes SDK changes' --retries=0
      - name: Install native Firefox browser
        if: matrix.browser == 'firefox'
        run: bash packages/browser-extension/scripts/install-firefox-test-browser.sh "$RUNNER_TEMP/activation-firefox"
      - name: Verify one-approval activation in Firefox
        if: matrix.browser == 'firefox'
        env:
          FIREFOX_BINARY: ${{ runner.temp }}/activation-firefox/firefox/firefox
          GECKODRIVER: ${{ runner.temp }}/activation-firefox/geckodriver
        run: python3 packages/browser-extension/tests/firefox/automatic_playground_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-rule-${{ matrix.browser }}-${{ github.sha }}
          path: packages/browser-extension/test-results
          if-no-files-found: ignore
          retention-days: 14
