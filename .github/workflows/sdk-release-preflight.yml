name: SDK release against public Firefox

on:
  push:
    branches: [main]
    paths:
      - packages/npm/**
      - packages/browser-extension/tests/firefox/**
      - scripts/verify-sdk-packages.mjs
      - scripts/prepare-legacy-sdk-patch.py
      - release/legacy-sdk/**
      - .github/workflows/sdk-release-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test and verify exact SDK archives
        run: |
          pnpm --filter wireflip test
          pnpm --filter wireflip build
          node scripts/verify-sdk-packages.mjs
          pnpm --filter website build
      - name: Install official Firefox and fetch public add-on
        run: |
          bash packages/browser-extension/scripts/install-firefox-test-browser.sh "$RUNNER_TEMP/firefox"
          curl --fail --location --retry 3 --retry-all-errors \
            https://addons.mozilla.org/firefox/downloads/file/5122149/cors_unlocker-2.0.0.xpi \
            --output "$RUNNER_TEMP/public-firefox-2.0.0.xpi"
      - name: Verify SDKs against public Firefox 2.0.0
        env:
          FIREFOX_BINARY: ${{ runner.temp }}/firefox/firefox/firefox
          GECKODRIVER: ${{ runner.temp }}/firefox/geckodriver
          FIREFOX_TEST_XPI: ${{ runner.temp }}/public-firefox-2.0.0.xpi
          FIREFOX_TEST_XPI_SHA256: 37828cb7a9695964b79e4b583ddb31d7c61c15bb8701f82668bb8cd633831301
        run: python3 packages/browser-extension/tests/firefox/sdk_package_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: public-firefox-sdk-release-${{ github.sha }}
          path: artifacts/sdk-preflight
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-firefox-sdk-diagnostics-${{ github.sha }}
          path: packages/browser-extension/test-results/firefox
          if-no-files-found: ignore
          retention-days: 7
