name: Website quality

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/website/**'
      - '.github/workflows/website-quality.yml'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - 'packages/website/**'
      - '.github/workflows/website-quality.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  website-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build SDK and static website
        run: |
          pnpm --filter wireflip build
          pnpm --filter website build
      - name: Install acceptance browser
        run: pnpm --filter browser-wireflip exec playwright install --with-deps chromium
      - name: Verify navigation, metadata and mobile performance
        env:
          WIREFLIP_LIGHTHOUSE: ${{ github.event_name != 'pull_request' && '1' || '0' }}
          WIREFLIP_INLINE_EVIDENCE: '0'
        run: node packages/website/scripts/verify-site.mjs
      - name: Upload screenshots and Lighthouse reports
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: website-quality-${{ github.sha }}
          path: artifacts/website-qa
          if-no-files-found: warn
          retention-days: 3
