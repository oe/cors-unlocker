name: Playground against public Firefox

on:
  pull_request:
    paths:
      - packages/website/**
      - packages/browser-extension/tests/firefox/**
      - .github/workflows/playground-firefox.yml
  push:
    branches: [main]
    paths:
      - packages/website/**
      - packages/browser-extension/tests/firefox/**
      - .github/workflows/playground-firefox.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playground:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm --filter wireflip build
          pnpm --filter website build
          python3 -m py_compile packages/browser-extension/tests/firefox/playground_test.py
      - name: Install official Firefox and published signed add-on
        run: |
          bash packages/browser-extension/scripts/install-firefox-test-browser.sh "$RUNNER_TEMP/firefox"
          curl --fail --location --retry 3 --retry-all-errors \
            https://addons.mozilla.org/firefox/downloads/file/5122149/cors_unlocker-2.0.0.xpi \
            --output "$RUNNER_TEMP/public-firefox-2.0.0.xpi"
      - name: Exercise actual Playground, workspace and Popup
        env:
          FIREFOX_BINARY: ${{ runner.temp }}/firefox/firefox/firefox
          GECKODRIVER: ${{ runner.temp }}/firefox/geckodriver
          FIREFOX_TEST_XPI: ${{ runner.temp }}/public-firefox-2.0.0.xpi
          FIREFOX_TEST_XPI_SHA256: 37828cb7a9695964b79e4b583ddb31d7c61c15bb8701f82668bb8cd633831301
        run: python3 packages/browser-extension/tests/firefox/playground_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playground-public-firefox-${{ github.sha }}
          path: packages/browser-extension/test-results/firefox
          if-no-files-found: ignore
          retention-days: 14
